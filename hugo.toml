title = "Bloggings"
baseURL = "https://mfroeh.github.io"
locale = "en-us"
theme = ["PaperMod"]

[params]
mainSections = ["posts"]
author = "mfroeh"
description = "Various bloggings"
showReadingTime = true
showToc = true

[[menus.main]]
name = "Posts"
title = "A list of all blog posts on this site"
pageRef = "/posts"
weight = 20

[[menus.main]]
name = "Tags"
title = "Filter posts by topic"
pageRef = "/tags"
weight = 25

[[menus.main]]
name = "Contact"
title = "Reach me via email"
url = "mailto:mfroeh0@pm.com"
weight = 30

[[menus.main]]
name = "Misc"
title = "Misc"
pageRef = "/misc.md"
weight = 35

[permalinks]
posts = "/:year/:month/:slug/"

[taxonomies]
tag = "tags"
category = "categories"

[markup.highlight]
codeFences = true
guessSyntax = true
lineNos = false
lineNumbersInTable = false
noClasses = true
style = "gruvbox"
